# Throwaway: verifies TAP_DEPLOY_TOKEN can READ the homebrew-tap.
# Read-only — never writes the formula. Delete after confirming.
name: Tap Token Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read tap formula SHA with TAP_DEPLOY_TOKEN
        env:
          TAP_TOKEN: ${{ secrets.TAP_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_DEPLOY_TOKEN secret is empty/not set."
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: token $TAP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/nguyenytran/homebrew-tap/contents/Formula/swctl.rb")
          echo "HTTP $code"
          sha=$(grep -o '"sha": *"[0-9a-f]*"' /tmp/resp.json | head -1 || true)
          if [ "$code" = "200" ] && [ -n "$sha" ]; then
            echo "::notice::TAP_DEPLOY_TOKEN works — read tap formula ($sha)."
          else
            echo "::error::Token cannot read the tap (HTTP $code). Regenerate + set the secret."
            head -c 400 /tmp/resp.json
            exit 1
          fi
